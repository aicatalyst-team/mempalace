apiVersion: batch/v1
kind: Job
metadata:
  name: mempalace-help-output
  namespace: mempalace
  labels:
    app.kubernetes.io/name: mempalace
    app.kubernetes.io/component: help-output
    app.kubernetes.io/managed-by: autopoc
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 30
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mempalace
        app.kubernetes.io/component: help-output
    spec:
      imagePullSecrets:
        - name: quay-aicatalyst-pull
      containers:
        - name: mempalace
          image: quay.io/aicatalyst/mempalace-mempalace:latest
          imagePullPolicy: Always
          command: ["mempalace"]
          args: ["--help"]
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      restartPolicy: Never
