apiVersion: batch/v1
kind: Job
metadata:
  name: mempalace-init-palace
  namespace: mempalace
  labels:
    app.kubernetes.io/name: mempalace
    app.kubernetes.io/component: init-palace
    app.kubernetes.io/managed-by: autopoc
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 60
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mempalace
        app.kubernetes.io/component: init-palace
    spec:
      imagePullSecrets:
        - name: quay-aicatalyst-pull
      containers:
        - name: mempalace
          image: quay.io/aicatalyst/mempalace-mempalace:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - >-
              mkdir -p /tmp/sample-project &&
              printf '# Sample Project\nThis is a test project for MemPalace PoC validation.\n' > /tmp/sample-project/README.md &&
              mempalace init /tmp/sample-project
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: palace-data
              mountPath: /opt/app-root/.mempalace
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: palace-data
          emptyDir: {}
      restartPolicy: Never
